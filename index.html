<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Honorarios - CPIM</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
min-height:100vh;padding:20px}
.container{
max-width:1200px;margin:0 auto;
background:rgba(255,255,255,.95);
border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1)}
.header{
background:linear-gradient(135deg,#2c5aa0 0%,#1e3c72 100%);
color:#fff;padding:30px;text-align:center}
.header h1{font-size:2.5rem;margin-bottom:10px}
.content{
display:grid;grid-template-columns:1fr 1fr;
gap:30px;padding:40px}
.form-section,.results-section{
background:#fff;padding:30px;border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
border:1px solid #e8ecf4}
.form-group{margin-bottom:25px}
label{font-weight:600;color:#2c5aa0;margin-bottom:8px;display:block}
.form-control{
width:100%;padding:12px 15px;border-radius:10px;
border:2px solid #e8ecf4;background:#fafbfc}
.form-control:disabled{background:#eee;font-weight:600}
.calculate-btn{
width:100%;padding:15px;border:none;border-radius:10px;
background:linear-gradient(135deg,#2c5aa0,#1e3c72);
color:#fff;font-size:1.1rem;cursor:pointer}
.result-card{
background:linear-gradient(135deg,#667eea,#764ba2);
color:#fff;padding:25px;border-radius:15px;text-align:center}
.result-value{font-size:2.5rem;font-weight:700}
.breakdown{background:#f8f9fc;padding:20px;border-radius:10px}
.breakdown-item{
display:flex;justify-content:space-between;
padding:6px 0;border-bottom:1px solid #e8ecf4}
.hidden{display:none}
@media(max-width:768px){
.content{grid-template-columns:1fr;padding:20px}
}
</style>
</head>

<body>
<div class="container">
<div class="header">
<h1><i class="fas fa-calculator"></i> Simulador de Honorarios</h1>
<p>Consejo Profesional de Ingeniería de Misiones - Marzo 2025</p>
</div>

<div class="content">
<div class="form-section">
<h2 style="color:#2c5aa0;margin-bottom:20px">
<i class="fas fa-edit"></i> Datos del Proyecto
</h2>

<div class="form-group">
<label>Categoría de Obra</label>
<select id="categoria" class="form-control">
<option value="">Seleccione categoría</option>
</select>
</div>

<div class="form-group">
<label>Tipología</label>
<select id="tipologia" class="form-control" disabled>
<option value="">Seleccione tipología</option>
</select>
</div>

<div class="form-group">
<label>Valor del m² (calculado)</label>
<input id="valorM2" class="form-control" disabled>
</div>

<div class="form-group">
<label>Superficie (m²)</label>
<input type="number" id="superficie" class="form-control" min="1">
</div>

<div class="form-group">
<label>Etapa del Proyecto</label>
<select id="etapaProyecto" class="form-control">
<option value="">Seleccione etapa</option>
<option value="croquis">Croquis (5%)</option>
<option value="anteproyecto">Anteproyecto (20%)</option>
<option value="planos_construccion">Planos (40%)</option>
<option value="proyecto_completo">Proyecto Completo (60%)</option>
</select>
</div>

<button class="calculate-btn" onclick="calcular()">Calcular Honorarios</button>
</div>

<div class="results-section">
<div id="resultados" class="hidden">
<div class="result-card">
<div class="result-value" id="total">$0</div>
<div>Honorarios Profesionales</div>
</div>
<div class="breakdown" id="detalle"></div>
</div>
</div>
</div>
</div>

<script>
const BASE_M2 = 1231951.07;

const TIPOLOGIAS = {
"VIVIENDA":[
{n:"Tradicional económica",c:0.88},
{n:"Tradicional estándar",c:1},
{n:"Unifamiliar",c:1.25},
{n:"Suntuosa",c:1.36},
{n:"Lujosa / Country",c:1.75}
],
"COMERCIO":[
{n:"Minorista hasta 50 m²",c:0.63},
{n:"50 a 300 m²",c:0.88},
{n:"Mayor a 300 m²",c:1},
{n:"Shopping",c:1.75}
],
"SALUD":[
{n:"Consultorios",c:1.25},
{n:"Clínicas",c:1.25},
{n:"Hospitales",c:1.75}
]
};

const ETAPAS={
croquis:0.05,
anteproyecto:0.20,
planos_construccion:0.40,
proyecto_completo:0.60
};

const cat=document.getElementById("categoria");
const tip=document.getElementById("tipologia");
const m2=document.getElementById("valorM2");

Object.keys(TIPOLOGIAS).forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;cat.appendChild(o);
});

cat.onchange=()=>{
tip.innerHTML='<option value="">Seleccione tipología</option>';
tip.disabled=true;m2.value="";
if(!cat.value)return;
TIPOLOGIAS[cat.value].forEach((t,i)=>{
let o=document.createElement("option");
o.value=i;o.textContent=t.n;tip.appendChild(o);
});
tip.disabled=false;
};

tip.onchange=()=>{
if(tip.value==="")return;
let coef=TIPOLOGIAS[cat.value][tip.value].c;
let v=BASE_M2*coef;
m2.value=v.toLocaleString("es-AR",{style:"currency",currency:"ARS"});
m2.dataset.valor=v;
};

function calcular(){
const sup=+document.getElementById("superficie").value;
const etapa=document.getElementById("etapaProyecto").value;
const vm2=+m2.dataset.valor||0;
if(!vm2||!sup||!etapa){alert("Complete todos los datos");return;}

const valorObra=vm2*sup;
let honorarios=valorObra<=115000000?valorObra*0.09:
valorObra<=275000000?115000000*0.09+(valorObra-115000000)*0.07:
115000000*0.09+(275000000-115000000)*0.07+(valorObra-275000000)*0.05;

honorarios=Math.max(honorarios,387709);
const total=honorarios*ETAPAS[etapa];

document.getElementById("total").innerText=
total.toLocaleString("es-AR",{style:"currency",currency:"ARS"});

document.getElementById("detalle").innerHTML=`
<div class="breakdown-item"><span>Valor obra</span><span>${valorObra.toLocaleString("es-AR",{style:"currency",currency:"ARS"})}</span></div>
<div class="breakdown-item"><span>Superficie</span><span>${sup} m²</span></div>
<div class="breakdown-item"><span>Valor m²</span><span>${vm2.toLocaleString("es-AR",{style:"currency",currency:"ARS"})}</span></div>
`;

document.getElementById("resultados").classList.remove("hidden");
}
</script>
</body>
</html>
